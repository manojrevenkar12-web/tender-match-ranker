[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-match-ranker"
version = "0.1.0"
description = "Which subcontractors to invite to a construction tender lot: ranking from biased logs, off-policy evaluation, fatigue-aware slates, a trade reader for German lot texts, an invite-planning agent, serving and monitoring."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "lightgbm>=4.5",
  "torch>=2.4",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
tmr = "tmr.cli:main"

[tool.setuptools.packages.find]
include = ["tmr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: builds a market and trains the models (a few minutes)",
  "db: needs PostgreSQL in TMR_TEST_DATABASE_URL",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806", "B905", "SIM108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
